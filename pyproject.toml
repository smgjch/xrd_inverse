[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrdbench"
version = "0.2.1"
description = "Shared simulated PXRD lattice inverse-problem protocol and evaluator"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "pymatgen==2024.11.13", "monty==2024.10.21", "spglib==2.5.0"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
hub = ["huggingface_hub>=0.36,<2"]
baseline = ["torch>=2.7,<2.8"]

[project.scripts]
xrdbench = "xrdbench.cli:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_LICENSES/*.txt"]

[tool.setuptools.packages.find]
include = ["xrdbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
